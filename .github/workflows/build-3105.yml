name: Build 3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ThreeOneOSFive/**'
      - 'ThreeOneOSFive.xcodeproj/**'
      - '.github/workflows/build-3105.yml'

jobs:
  build-3105:
    name: Build 3105 Native iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Build 3105 Project
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS="-Wno-error" \
            clean build 2>&1 | tee build.log

      - name: Show Diagnostics on Failure
        if: failure()
        run: |
          echo "=== SCANNING ERRORS IN BUILD LOG ==="
          grep -E "error:" build.log || true
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -n 100 build.log || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/3105.app Payload/
          zip -r9 3105_v1.1.1_unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105_v1.1.1_unsigned.ipa
          path: 3105_v1.1.1_unsigned.ipa
          retention-days: 30
