name: Build 3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ThreeOneOSFive/**'
      - 'ThreeOneOSFive.xcodeproj/**'
      - '.github/workflows/build-3105.yml'

jobs:
  build-3105:
    name: Build 3105 Native iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Build 3105 Project
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/3105.app Payload/
          zip -r9 3105_v1.1.1_unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105_v1.1.1_unsigned.ipa
          path: 3105_v1.1.1_unsigned.ipa
          retention-days: 30
